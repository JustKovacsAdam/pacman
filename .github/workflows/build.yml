name: Build game

# Builds standalone Windows / macOS / Linux versions of the game with GameCI.
# Download them from the "Artifacts" section of a finished workflow run.
#
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   UNITY_LICENSE   - contents of your Unity .ulf license file
#   UNITY_EMAIL     - Unity account e-mail
#   UNITY_PASSWORD  - Unity account password
# See https://game.ci/docs/github/activation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has-license: ${{ steps.check.outputs.has-license }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "has-license=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-license=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UNITY_LICENSE secret is not set, skipping the build. See the README."
          fi

  build:
    needs: check-secrets
    if: needs.check-secrets.outputs.has-license == 'true'
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - StandaloneOSX
          - StandaloneLinux64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: PacMan

      - uses: actions/upload-artifact@v4
        with:
          name: PacMan-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
